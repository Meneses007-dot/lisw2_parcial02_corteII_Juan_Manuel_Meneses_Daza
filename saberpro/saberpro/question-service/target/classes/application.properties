spring.application.name=question-service
server.port=8083

# H2 en memoria (consola: http://localhost:8083/h2-console  JDBC: jdbc:h2:mem:questiondb)
spring.datasource.url=jdbc:h2:mem:questiondb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Validation Service
validation.service.url=http://localhost:8082
